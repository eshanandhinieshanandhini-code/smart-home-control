<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-IoT Smart Home</title>

<style>
body{
  font-family:Arial;
  background:#101820;
  color:white;
  text-align:center;
  padding:15px;
}

h1{
  color:#00e5ff;
}

.card{
  background:#1c2833;
  border-radius:15px;
  padding:20px;
  margin:15px auto;
  max-width:420px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 20px;
  margin:5px;
  font-size:16px;
  color:white;
}

.on{
  background:#00a86b;
}

.off{
  background:#d63031;
}

.status{
  font-size:20px;
  margin:10px;
}

.value{
  font-size:20px;
  color:#00ff99;
}
</style>
</head>

<body>

<h1>🏠 E-IoT SMART HOME</h1>

<div class="card">
<h2>🚶 Motion</h2>
<div class="status">
Status: <span id="motion">OFF</span>
</div>

<button class="on" onclick="setControl('motion',true)">
MOTION ON
</button>

<button class="off" onclick="setControl('motion',false)">
MOTION OFF
</button>
</div>


<div class="card">
<h2>💡 Room Light</h2>

<div class="status">
Status: <span id="light">OFF</span>
</div>

<button class="on" onclick="setControl('light',true)">
LIGHT ON
</button>

<button class="off" onclick="setControl('light',false)">
LIGHT OFF
</button>
</div>


<div class="card">
<h2>🌀 Fan</h2>

<div class="status">
Status: <span id="fan">OFF</span>
</div>

<button class="on" onclick="setControl('fan',true)">
FAN ON
</button>

<button class="off" onclick="setControl('fan',false)">
FAN OFF
</button>
</div>


<div class="card">
<h2>🔔 Buzzer</h2>

<div class="status">
Status: <span id="buzzer">OFF</span>
</div>

<button class="on" onclick="setControl('buzzer',true)">
BUZZER ON
</button>

<button class="off" onclick="setControl('buzzer',false)">
BUZZER OFF
</button>
</div>


<div class="card">
<h2>🌡 Environment</h2>

<div class="value">
Temperature: <span id="temperature">--</span> °C
</div>

<div class="value">
Humidity: <span id="humidity">--</span> %
</div>
</div>


<div class="card">
<h2>🔥 Gas</h2>

<div class="value">
Gas: <span id="gasppm">--</span> PPM
</div>

<div class="status">
Alarm: <span id="gasalarm">SAFE</span>
</div>
</div>


<div class="card">
<h2>💧 Water</h2>

<div class="value">
Water: <span id="water">--</span>
</div>

<div class="status">
Status: <span id="wateralarm">SAFE</span>
</div>
</div>


<script>

const FIREBASE_URL =
"https://smart-home-control-2ab9e-default-rtdb.firebaseio.com";


function setControl(device,state)
{
  fetch(FIREBASE_URL + "/control/" + device + ".json",{
    method:"PUT",
    body:JSON.stringify(state)
  })
  .then(response => {

    if(!response.ok)
    {
      throw new Error("Firebase write failed");
    }

    updateStatus();
  })
  .catch(error => {
    console.log(error);
    alert("Firebase connection error");
  });
}


function updateStatus()
{
  fetch(FIREBASE_URL + "/status.json")
  .then(response => response.json())
  .then(data => {

    if(!data)
      return;

    document.getElementById("motion").innerHTML =
      data.motion ? "ON" : "OFF";

    document.getElementById("light").innerHTML =
      data.light ? "ON" : "OFF";

    document.getElementById("fan").innerHTML =
      data.fan || "OFF";

    document.getElementById("buzzer").innerHTML =
      data.buzzer ? "ON" : "OFF";

    document.getElementById("temperature").innerHTML =
      data.temperature ?? "--";

    document.getElementById("humidity").innerHTML =
      data.humidity ?? "--";

    document.getElementById("gasppm").innerHTML =
      data.gasppm ?? "--";

    document.getElementById("gasalarm").innerHTML =
      data.gasalarm ? "🚨 ALARM" : "SAFE";

    document.getElementById("water").innerHTML =
      data.water ?? "--";

    document.getElementById("wateralarm").innerHTML =
      data.wateralarm ? "🚨 ALARM" : "SAFE";
  })
  .catch(error => {
    console.log("Status error:",error);
  });
}


setInterval(updateStatus,1000);

updateStatus();

</script>

</body>
</html>
